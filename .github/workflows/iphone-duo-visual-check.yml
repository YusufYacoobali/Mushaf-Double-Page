name: iPhone Duo visual check

on:
  workflow_dispatch:
  push:
    branches: [v5, v6]
    paths:
      - '.github/workflows/iphone-duo-visual-check.yml'
      - '.github/scripts/**'
      - 'ios/Runner/**'
      - 'ios/Flutter/**'
      - 'ios/Runner.xcodeproj/project.pbxproj'
      - 'lib/main.dart'
      - 'lib/utils/**'
      - 'lib/pages/page_view.dart'
      - 'lib/components/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: quran-duo-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Build iOS simulator (${{ matrix.version }})
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        version: [v5, v6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version == 'v5' && '1df8a49e646f61355feafc790431ee3209f61c6c' || github.sha }}
      # Reuse the already compiled app when only QA scripts changed. Prove the
      # application source matches that artifact; expired artifacts fall back
      # to a normal build. Both build refs are pinned, not moving branch names.
      - name: Check reusable simulator build provenance
        id: source
        env:
          BUILD_REF: ${{ matrix.version == 'v5' && '1df8a49e646f61355feafc790431ee3209f61c6c' || 'c38d63d98cb25ab043aeb464ad2e28090bf6227b' }}
        run: |
          git fetch --depth=1 origin "$BUILD_REF"
          if git diff --quiet "$BUILD_REF" HEAD -- lib ios pubspec.yaml pubspec.lock; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
            echo "Application source matches verified build ref $BUILD_REF"
          fi
      - uses: actions/download-artifact@v4
        id: reuse-app
        if: steps.source.outputs.reuse == 'true'
        continue-on-error: true
        with:
          name: quran-ios-simulator-${{ matrix.version }}
          run-id: 44285311302
          github-token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        if: steps.reuse-app.outcome != 'success'
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true
      - name: Install Flutter dependencies
        if: steps.reuse-app.outcome != 'success'
        run: flutter pub get
      - name: Verify UIScene migration
        if: steps.reuse-app.outcome != 'success'
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' ios/Runner/Info.plist | grep SceneDelegate
          grep -q 'FlutterImplicitEngineDelegate' ios/Runner/AppDelegate.swift
      - name: Set Xcode 27-only simulator minimum targets
        if: steps.reuse-app.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          ruby - <<'RUBY'
          path = 'ios/Podfile'
          text = File.read(path)
          marker = "    flutter_additional_ios_build_settings(target)\n"
          abort 'Podfile marker not found' unless text.include?(marker)
          override = <<~CFG
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            end
          CFG
          File.write(path, text.sub(marker, marker + override.lines.map { |line| '    ' + line }.join))
          RUBY
      - name: Build Flutter simulator app (arm64)
        if: steps.reuse-app.outcome != 'success'
        run: FLUTTER_XCODE_ARCHS=arm64 flutter build ios --simulator --debug --no-pub
      - name: Archive simulator application with permissions preserved
        if: steps.reuse-app.outcome != 'success'
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          tar -czf ios-simulator-runner.tgz -C build/ios/iphonesimulator Runner.app
          ls -lh ios-simulator-runner.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: quran-ios-simulator-${{ matrix.version }}
          path: ios-simulator-runner.tgz
          retention-days: 7
          if-no-files-found: error

  iphone-duo:
    name: Test clean iPhone Duo (all zooms)
    needs: build-simulator
    runs-on: xcode-27
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quran-ios-simulator-v6
      - name: Extract app
        run: |
          mkdir -p ci-app
          tar -xzf ios-simulator-runner.tgz -C ci-app
          test -d ci-app/Runner.app
      - name: Install Duo controls (no accessibility dependency)
        run: brew install skarol/tap/duoctl
      - name: Install screenshot validation tools
        run: |
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install --quiet Pillow
          echo "$PWD/.qa-venv/bin" >> "$GITHUB_PATH"
      - name: Capture every zoom in folded, unfolded, and half-open modes
        shell: bash
        run: bash .github/scripts/run_duo_simulator_qa.sh
      - name: Upload actual Duo screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-duo-diagnostics
          path: |
            screenshots/*.json
            screenshots/*.txt
            screenshots/*.log
            screenshots/book-*
            screenshots/last-duo-screen.png
            screenshots/notification-alert.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-folded
          path: screenshots/duo-folded-[0-9]*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-folded-landscape
          path: screenshots/duo-folded-landscape-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-unfolded-portrait
          path: screenshots/duo-unfolded-portrait-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-unfolded-landscape
          path: screenshots/duo-unfolded-wide-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-half-open-book
          path: screenshots/duo-half-open-book-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-half-open-tabletop
          path: screenshots/duo-half-open-tabletop-*.png
          retention-days: 14

  ipad-mini:
    name: iPad ${{ matrix.family }} (${{ matrix.version }}, both orientations, all zooms)
    needs: build-simulator
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: [v5, v6]
        family: [mini, ipad, air11, air13, pro11, pro13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quran-ios-simulator-${{ matrix.version }}
      - name: Extract app
        run: |
          mkdir -p ci-app
          tar -xzf ios-simulator-runner.tgz -C ci-app
          test -d ci-app/Runner.app
      - name: Install verified simulator orientation controls
        run: brew install skarol/tap/duoctl
      - name: Install screenshot validation tools
        run: |
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install --quiet Pillow
          echo "$PWD/.qa-venv/bin" >> "$GITHUB_PATH"
      - name: Capture iPad portrait and landscape at every zoom
        shell: bash
        env:
          IPAD_FAMILY: ${{ matrix.family }}
          VERIFY_READER_LOG: ${{ matrix.version == 'v6' && '1' || '0' }}
        run: bash .github/scripts/run_ipad_simulator_qa.sh
      - name: Upload iPad screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-ipad-${{ matrix.family }}-${{ matrix.version }}-diagnostics
          path: |
            screenshots-ipad/*.json
            screenshots-ipad/*.txt
            screenshots-ipad/*.log
            screenshots-ipad/screenshot-on-error.png
            screenshots-ipad/notification-alert.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-ipad-${{ matrix.family }}-${{ matrix.version }}-portrait-low
          path: screenshots-ipad/ipad-*-portrait-[78]*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-ipad-${{ matrix.family }}-${{ matrix.version }}-portrait-high
          path: screenshots-ipad/ipad-*-portrait-[19]*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-ipad-${{ matrix.family }}-${{ matrix.version }}-landscape-low
          path: |
            screenshots-ipad/ipad-*-landscape-[67]*.png
            screenshots-ipad/ipad-*-landscape-80.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-ipad-${{ matrix.family }}-${{ matrix.version }}-landscape-high
          path: |
            screenshots-ipad/ipad-*-landscape-85.png
            screenshots-ipad/ipad-*-landscape-[19]*.png
          retention-days: 14

  compare-ipads:
    name: Compare actual v5 and v6 iPad screenshots
    needs: ipad-mini
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quran-ipad-*
          path: ipad-captures
      - run: python3 -m pip install Pillow
      - run: python3 .github/scripts/compare_ipad_captures.py ipad-captures ipad-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-ipad-v5-v6-comparison
          path: ipad-comparison/
          if-no-files-found: error
          retention-days: 14
