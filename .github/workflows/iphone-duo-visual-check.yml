name: iPhone Duo visual check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iphone-duo-visual-check.yml'
      - '.github/scripts/capture_duo_zoom.sh'
      - 'ios/Runner/**'
      - 'ios/Runner.xcodeproj/project.pbxproj'
      - 'lib/main.dart'
      - 'lib/utils/deferred_reminders.dart'
      - 'lib/utils/reader_layout.dart'
      - 'lib/pages/page_view.dart'
      - 'lib/components/adaptive_quran_pages.dart'

permissions:
  contents: read

jobs:
  screenshot-duo-and-ipad:
    runs-on: xcode-27
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true
      - name: Verify Flutter button lookup against duplicated labels
        run: |
          python3 - <<'PY'
          import importlib.util, json, tempfile
          spec = importlib.util.spec_from_file_location(
              "duo", ".github/scripts/duo_accessibility_tap.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.NamedTemporaryFile(mode="w+", suffix=".json") as test:
              json.dump([
                {"type": "Application", "label": "Quran Dual Page"},
                {"type": "Button", "label": "Open navigation\\nOpen navigation",
                 "frame": {"x": 160, "y": 638, "width": 72, "height": 24}},
                {"type": "Button", "label": "Zoom out\\nZoom out",
                 "frame": {"x": 90, "y": 600, "width": 32, "height": 32}}
              ], test)
              test.flush()
              assert module.find_center(test.name, "Open navigation") == (196, 650)
              assert module.find_center(test.name, "Zoom out") == (106, 616)
              print("Duplicate-label button lookup and coordinate resolution PASS")
          PY
      - name: Inspect Apple simulator availability
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          df -h .
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Require iOS 27 UIScene adoption
        shell: bash
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' ios/Runner/Info.plist | grep -F SceneDelegate
          grep -Fq 'FlutterImplicitEngineDelegate' ios/Runner/AppDelegate.swift
          grep -Fq 'didInitializeImplicitFlutterEngine' ios/Runner/AppDelegate.swift
          echo 'UIScene and implicit Flutter engine registration configured'
      # Xcode 27 rejects the legacy iOS 11-13 deployment targets embedded in
      # third-party pods. This is a CI-only adjustment; do not raise the
      # published app's actual minimum iOS version to capture screenshots.
      - name: Normalize simulator deployment targets for Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          ruby - <<'RUBY'
          path = "ios/Podfile"
          text = File.read(path)
          marker = "    flutter_additional_ios_build_settings(target)\n"
          unless text.include?(marker)
            abort "Could not locate flutter_additional_ios_build_settings in Podfile"
          end
          override = <<~CFG
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            end
          CFG
          text.sub!(marker, marker + override.lines.map { |line| "    " + line }.join)
          File.write(path, text)
          RUBY
      - name: Build actual Flutter iOS simulator app
        run: FLUTTER_XCODE_ARCHS=arm64 flutter build ios --simulator --debug --no-pub
      - name: Install Duo simulator control tool
        run: |
          brew install skarol/tap/duoctl
          brew install cameroncooke/axe/axe
      - name: Capture real iPhone Duo screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          APP="build/ios/iphonesimulator/Runner.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          UDID="$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name == "iPhone Duo" and (.isAvailable == true))][0].udid')"
          if [[ "$UDID" == "null" || -z "$UDID" ]]; then
            echo "::error::This Xcode runner has no installed iPhone Duo simulator"
            exit 1
          fi
          echo "DUOCTL_UDID=$UDID" >> "$GITHUB_ENV"
          export DUOCTL_UDID="$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # Xcode 27 can return from simctl install *before* FrontBoard has
          # registered the new bundle. This happens on cold CI simulators:
          # SpringBoard announces registration 10-30s after installation.
          # Retrying is required even when install itself succeeded.
          xcrun simctl listapps "$UDID" > screenshots/duo-installed-apps.txt 2>&1 || true
          sleep 25
          LAUNCHED=0
          for attempt in $(seq 1 12); do
            echo "Duo app launch attempt $attempt of 12"
            if xcrun simctl launch "$UDID" "$BUNDLE_ID" > screenshots/duo-last-launch.txt 2>&1; then
              cat screenshots/duo-last-launch.txt
              LAUNCHED=1
              break
            fi
            cat screenshots/duo-last-launch.txt
            sleep 8
          done
          if [[ "$LAUNCHED" -ne 1 ]]; then
            echo "::error::App was installed but could not be launched after FrontBoard registration retries"
            xcrun simctl listapps "$UDID" > screenshots/duo-postfailure-installed-apps.txt 2>&1 || true
            exit 1
          fi
          # AXe may report 'simulator still starting' even after simctl
          # bootstatus completes. Wait for its display service to respond.
          for attempt in $(seq 1 15); do
            if axe displays --udid "$UDID" > screenshots/duo-displays.txt 2>&1; then
              break
            fi
            sleep 4
          done

          # Capture immediate evidence instead of incorrectly treating the
          # iOS home screen as a Quran reader screenshot.
          sleep 5
          axe describe-ui --udid "$UDID" > screenshots/duo-immediate-ui.json 2>&1 || true
          duoctl screenshot screenshots/duo-immediate.png || true

          # simctl launch can return a PID even if the app immediately exits.
          # If the app is on SpringBoard, try an actual icon tap once.
          if grep -Fq '"Quran Dual Page"' screenshots/duo-immediate-ui.json; then
            echo "Detected app icon or app label; retrying via physical tap"
            axe tap --label "Quran Dual Page" --udid "$UDID" || true
            sleep 5
          fi
          axe describe-ui --udid "$UDID" > screenshots/duo-after-relaunch-ui.json 2>&1 || true
          duoctl screenshot screenshots/duo-after-relaunch.png || true

          # First installation downloads the actual Quran page images from
          # Firebase Storage. Never substitute mocked images for screenshots.
          DATA="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)"
          READY=0
          for n in $(seq 1 22); do
            if [[ -d "$DATA/Documents/indopak_tajweed" ]]; then
              COUNT=$(find "$DATA/Documents/indopak_tajweed" -type f -name '*.webp' | wc -l | tr -d ' ')
            else
              COUNT=0
            fi
            echo "Quran page images downloaded: $COUNT / 851"
            if [[ "$COUNT" -ge 851 ]]; then READY=1; break; fi
            if [[ "$n" == 7 || "$n" == 14 ]]; then
              echo "Checking app UI and retrying foreground launch (attempt $n)"
              axe describe-ui --udid "$UDID" > "screenshots/duo-download-attempt-$n.json" 2>&1 || true
              xcrun simctl launch "$UDID" "$BUNDLE_ID" || true
            fi
            sleep 8
          done
          echo "Duo pages-ready: $READY" | tee screenshots/duo-status.txt
          if [[ "$READY" -ne 1 ]]; then
            echo "::error::Duo reader not ready: 851 pages never appeared; inspecting simulator process and crash reports"
            duoctl screenshot screenshots/duo-download-incomplete.png || true
            axe describe-ui --udid "$UDID" > screenshots/duo-final-accessibility.json 2>&1 || true
            xcrun simctl spawn "$UDID" log show --last 6m --style compact --predicate 'process == "Runner" OR eventMessage CONTAINS[c] "mushafTwoPage" OR eventMessage CONTAINS[c] "Flutter"' 2>&1 | tail -n 2000 > screenshots/duo-application-logs.txt || true
            xcrun simctl spawn "$UDID" launchctl list > screenshots/duo-processes.txt 2>&1 || true
            mkdir -p screenshots/crash-reports
            find "$HOME/Library/Logs/DiagnosticReports" -type f -iname '*Runner*' -mmin -45 -exec cp -f {} screenshots/crash-reports/ \; 2>/dev/null || true
            exit 1
          fi

          # Record state as proof of the display being captured.
          duoctl close
          duoctl state | tee screenshots/duo-folded-state.json
          sleep 4
          duoctl screenshot screenshots/duo-folded.png
          # Single-page minimum 70%, maximum 100%.
          bash .github/scripts/capture_duo_zoom.sh duo-folded 70 100

          duoctl open
          duoctl state | tee screenshots/duo-unfolded-wide-state.json
          sleep 4
          duoctl screenshot screenshots/duo-unfolded-wide.png
          # Two-page minimum 60%, maximum 100%.
          bash .github/scripts/capture_duo_zoom.sh duo-unfolded-wide 60 100

          duoctl rotate portrait
          duoctl state | tee screenshots/duo-unfolded-portrait-state.json
          sleep 4
          duoctl screenshot screenshots/duo-unfolded-portrait.png
          bash .github/scripts/capture_duo_zoom.sh duo-unfolded-portrait 60 100
          echo "Captured:"
          ls -lah screenshots/
      - name: Diagnose missing reader on Duo
        if: failure()
        shell: bash
        run: |
          mkdir -p screenshots
          if [[ -z "${DUOCTL_UDID:-}" ]]; then
            echo "Duo simulator was not yet booted; no runtime diagnostics available" > screenshots/duo-runtime-diagnostic.txt
            exit 0
          fi
          echo "Inspecting simulator after the reader failed to become ready" > screenshots/duo-runtime-diagnostic.txt
          axe describe-ui --udid "$DUOCTL_UDID" > screenshots/duo-accessibility-on-failure.txt 2>&1 || true
          xcrun simctl spawn "$DUOCTL_UDID" launchctl list > screenshots/duo-launchctl.txt 2>&1 || true
          xcrun simctl spawn "$DUOCTL_UDID" log show --last 12m --style compact --predicate 'process == "Runner" OR eventMessage CONTAINS[c] "mushafTwoPage" OR eventMessage CONTAINS[c] "Flutter"' 2>&1 | tail -n 2500 > screenshots/duo-runtime-log.txt || true
          DIAG="$HOME/Library/Developer/CoreSimulator/Devices/$DUOCTL_UDID/data/Library/Logs/DiagnosticReports"
          if [[ -d "$DIAG" ]]; then
            find "$DIAG" -maxdepth 1 -type f -name '*.ips' -mmin -30 -exec cp {} screenshots/ \; || true
          fi
          echo "Simulator diagnostics collected (not a reader-layout assertion)"

      - name: Capture iPad mini comparison
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="build/ios/iphonesimulator/Runner.app"
          IPAD="$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name == "iPad mini (A17 Pro)" and .isAvailable == true)][0].udid')"
          if [[ "$IPAD" == "null" || -z "$IPAD" ]]; then
            echo "No iPad mini (A17 Pro) simulator on this runner; skipping comparison"
            exit 0
          fi
          xcrun simctl shutdown "$DUOCTL_UDID" || true
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl install "$IPAD" "$APP"
          sleep 25
          IPAD_LAUNCHED=0
          for attempt in $(seq 1 12); do
            if xcrun simctl launch "$IPAD" "$BUNDLE_ID"; then
              IPAD_LAUNCHED=1
              break
            fi
            sleep 8
          done
          if [[ "$IPAD_LAUNCHED" -ne 1 ]]; then
            echo "::error::iPad simulator installation did not register with FrontBoard"
            exit 1
          fi
          DATA="$(xcrun simctl get_app_container "$IPAD" "$BUNDLE_ID" data)"
          for n in $(seq 1 50); do
            if [[ -d "$DATA/Documents/indopak_tajweed" ]]; then
              COUNT=$(find "$DATA/Documents/indopak_tajweed" -type f -name '*.webp' | wc -l | tr -d ' ')
            else
              COUNT=0
            fi
            echo "iPad pages: $COUNT / 851"
            if [[ "$COUNT" -ge 851 ]]; then break; fi
            sleep 8
          done
          xcrun simctl io "$IPAD" screenshot screenshots/ipad-mini-portrait.png
      - name: Upload genuine simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-duo-and-ipad-mini-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
