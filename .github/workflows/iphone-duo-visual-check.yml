name: iPhone Duo visual check

on:
  workflow_dispatch:
  push:
    branches: [v5, v6]
    paths:
      - '.github/workflows/iphone-duo-visual-check.yml'
      - '.github/workflows/ipad-native-visual-check.yml'
      - 'tools/ios_ui_qa/**'
      - '.github/scripts/**'
      - 'ios/Runner/**'
      - 'ios/Runner.xcodeproj/project.pbxproj'
      - 'lib/main.dart'
      - 'lib/utils/reader_layout.dart'
      - 'lib/pages/page_view.dart'
      - 'lib/components/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: quran-duo-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Build iOS simulator application
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether application inputs changed
        id: source_check
        shell: bash
        run: |
          # This verified build remains reusable for QA-only changes. A cache
          # miss or any application change falls back to the original build.
          source_sha=a6005823141733078ed02fe08b39c708a2480905
          git cat-file -e "$source_sha^{commit}" 2>/dev/null || git fetch --depth=1 origin "$source_sha"
          if git cat-file -e "$source_sha^{commit}" 2>/dev/null && git diff --quiet "$source_sha" HEAD -- . ':(exclude).github/**' ':(exclude)test/**' ':(exclude)tools/ios_ui_qa/**'; then
            echo 'unchanged=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse verified unchanged simulator application
        id: prior_build
        if: steps.source_check.outputs.unchanged == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quran-ios-duo-simulator-build
          run-id: '44354643075'
          github-token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        if: steps.prior_build.outcome != 'success'
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true
      - name: Install Flutter dependencies
        if: steps.prior_build.outcome != 'success'
        run: flutter pub get
      - name: Verify UIScene migration
        run: |
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' ios/Runner/Info.plist | grep SceneDelegate
          grep -q 'FlutterImplicitEngineDelegate' ios/Runner/AppDelegate.swift
      - name: Set Xcode 27-only simulator minimum targets
        if: steps.prior_build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj
          ruby - <<'RUBY'
          path = 'ios/Podfile'
          text = File.read(path)
          marker = "    flutter_additional_ios_build_settings(target)\n"
          abort 'Podfile marker not found' unless text.include?(marker)
          override = <<~CFG
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            end
          CFG
          File.write(path, text.sub(marker, marker + override.lines.map { |line| '    ' + line }.join))
          RUBY
      - name: Build Flutter simulator app (arm64)
        if: steps.prior_build.outcome != 'success'
        run: FLUTTER_XCODE_ARCHS=arm64 flutter build ios --simulator --debug --no-pub
      - name: Archive simulator application with permissions preserved
        if: steps.prior_build.outcome != 'success'
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          tar -czf ios-simulator-runner.tgz -C build/ios/iphonesimulator Runner.app
          ls -lh ios-simulator-runner.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: quran-ios-duo-simulator-build
          path: ios-simulator-runner.tgz
          retention-days: 14
          if-no-files-found: error

  iphone-duo:
    name: Test clean iPhone Duo (all zooms)
    needs: build-simulator
    runs-on: xcode-27
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quran-ios-duo-simulator-build
      - name: Extract app
        run: |
          mkdir -p ci-app
          tar -xzf ios-simulator-runner.tgz -C ci-app
          test -d ci-app/Runner.app
      - name: Install Duo controls (no accessibility dependency)
        run: |
          brew install skarol/tap/duoctl tesseract
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install Pillow
          echo "$PWD/.qa-venv/bin" >> "$GITHUB_PATH"
      - name: Run folded, unfolded, and half-open reader screenshots
        shell: bash
        run: bash .github/scripts/run_duo_simulator_qa.sh
      - name: Upload actual Duo screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-duo-visual-qa
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-folded-endpoints
          path: |
            screenshots/duo-folded-min-*.png
            screenshots/duo-folded-max-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-unfolded-portrait-endpoints
          path: |
            screenshots/duo-unfolded-portrait-min-*.png
            screenshots/duo-unfolded-portrait-max-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-unfolded-wide-endpoints
          path: |
            screenshots/duo-unfolded-wide-min-*.png
            screenshots/duo-unfolded-wide-max-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-half-open-book-endpoints
          path: |
            screenshots/duo-half-open-book-min-*.png
            screenshots/duo-half-open-book-max-*.png
            screenshots/duo-half-open-book-after-swipe.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quran-duo-book-video
          path: |
            screenshots/duo-half-open-book.mov
            screenshots/duo-video.log
          retention-days: 14

  ipad-native:
    name: Compare iPads with v5
    needs: build-simulator
    uses: ./.github/workflows/ipad-native-visual-check.yml
    with:
      source_run_id: ${{ github.run_id }}
