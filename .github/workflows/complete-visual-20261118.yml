name: One-off complete v6 layout and zoom QA
run-name: Full v6 visual QA — Duo, iPad mini, 13-inch Pro (no 11-inch)
on:
  push:
    branches: [v6]
    paths:
      - '.github/complete-visual-20261118.request'
permissions:
  contents: read
  actions: read

# Never waste three macOS simulator runners on obsolete full test requests.
# A newer v6 request supersedes earlier unfinished runs.
concurrency:
  group: reader-full-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Gate on existing full Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reuse fast checks on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/require_fast_checks.py

  reader:
    needs: fast-checks
    uses: ./.github/workflows/ios-simulator-build.yml
    with:
      role: reader
      policy: auto

  reference:
    needs: fast-checks
    uses: ./.github/workflows/ios-simulator-build.yml
    with:
      source_ref: v5
      role: v5
      policy: auto

  duo:
    name: Duo — four postures / min and max zoom / all controls and book swipe
    needs: reader
    runs-on: xcode-27
    timeout-minutes: 65
    outputs:
      visual_passed: ${{ steps.verdict.outputs.visual_passed }}
    concurrency:
      group: reader-duo-device-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.reader.outputs.artifact_name }}
          path: reader-build
      - name: Extract verified build and install tools
        id: duo_setup
        continue-on-error: true
        run: |
          mkdir -p ci-app
          tar -xzf reader-build/ios-simulator-runner.tgz -C ci-app
          test -f ci-app/Runner.app/Info.plist
          brew install skarol/tap/duoctl tesseract
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install Pillow
          echo "$PWD/.qa-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: pages
        with:
          path: .ci/quran-pages
          key: reader-pages-${{ hashFiles('lib/logic/storage_manager.dart', 'lib/pages/loading.dart') }}
      - name: Capture every posture, min/max page fitting, all zoom steps and book gesture
        id: qa_capture
        if: steps.duo_setup.outcome == 'success'
        continue-on-error: true
        env:
          DUO_TARGET: duo-smoke
          READER_TEST_CASE: all
          READER_CAPTURE_PROFILE: endpoints
          READER_ASSET_CACHE: ${{ github.workspace }}/.ci/quran-pages
        run: bash .github/scripts/run_duo_simulator_qa.sh
      - uses: actions/cache/save@v4
        if: always() && steps.pages.outputs.cache-hit != 'true' && hashFiles('.ci/quran-pages/pages.json') != ''
        with:
          path: .ci/quran-pages
          key: reader-pages-${{ hashFiles('lib/logic/storage_manager.dart', 'lib/pages/loading.dart') }}
      - uses: actions/upload-artifact@v4
        id: artifact_upload
        if: always()
        continue-on-error: true
        with:
          name: all-v6-duo-layouts-and-zooms-primary
          overwrite: true
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Record actual primary Duo result (failed cases trigger clean Mac)
        if: always()
        id: verdict
        run: echo "visual_passed=${{ steps.duo_setup.outcome == 'success' && steps.qa_capture.outcome == 'success' && steps.artifact_upload.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

  duo-retry:
    name: Duo fresh-runner retry (only after an unsuccessful primary)
    needs: [reader, duo]
    if: ${{ !cancelled() && needs.reader.result == 'success' && needs.duo.outputs.visual_passed != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 65
    concurrency:
      group: reader-duo-device-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.reader.outputs.artifact_name }}
          path: reader-build
      - name: Prepare known compatible simulator app and tools on a NEW Mac
        run: |
          mkdir -p ci-app
          tar -xzf reader-build/ios-simulator-runner.tgz -C ci-app
          test -f ci-app/Runner.app/Info.plist
          brew install skarol/tap/duoctl tesseract
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install Pillow
          echo "$PWD/.qa-venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: pages
        with:
          path: .ci/quran-pages
          key: reader-pages-${{ hashFiles('lib/logic/storage_manager.dart', 'lib/pages/loading.dart') }}
      - name: Retry every Duo posture and genuine page/screenshot check on clean host
        env:
          DUO_TARGET: duo-smoke
          READER_TEST_CASE: all
          READER_CAPTURE_PROFILE: endpoints
          READER_ASSET_CACHE: ${{ github.workspace }}/.ci/quran-pages
        run: bash .github/scripts/run_duo_simulator_qa.sh
      - uses: actions/cache/save@v4
        if: always() && steps.pages.outputs.cache-hit != 'true' && hashFiles('.ci/quran-pages/pages.json') != ''
        with:
          path: .ci/quran-pages
          key: reader-pages-${{ hashFiles('lib/logic/storage_manager.dart', 'lib/pages/loading.dart') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-v6-duo-layouts-and-zooms-retry
          overwrite: true
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

  ipad-mini-and-pro13:
    name: iPads — mini and 13-inch, v5 comparison and all zooms
    needs: [reader, reference]
    uses: ./.github/workflows/ipad-native-visual-check.yml
    with:
      devices: '["mini","pro13"]'
      test_case: all
      artifact_name: ${{ needs.reader.outputs.artifact_name }}
      reference_artifact: ${{ needs.reference.outputs.artifact_name }}

  verify-visual-evidence:
    name: Accept only real Duo and iPad layout/zoom screenshots
    if: ${{ !cancelled() }}
    needs: [duo, duo-retry, ipad-mini-and-pro13]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download actual Duo screenshots and metadata
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.duo.outputs.visual_passed == 'true' && 'all-v6-duo-layouts-and-zooms-primary' || 'all-v6-duo-layouts-and-zooms-retry' }}
          path: qa/duo
      - name: Download actual iPad mini screenshots and v5 comparison
        uses: actions/download-artifact@v4
        with:
          name: ipad-mini-all
          path: qa/ipad-mini
      - name: Download actual 13-inch Pro screenshots and v5 comparison
        uses: actions/download-artifact@v4
        with:
          name: ipad-pro13-all
          path: qa/ipad-pro13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot EXIF orientation validator
        run: python3 -m pip install --quiet Pillow
      - name: Verify every posture, intermediate zoom, navigation and RTL page turn
        run: |
          python3 .github/scripts/verify_visual_evidence.py \
            --duo qa/duo --mini qa/ipad-mini --pro13 qa/ipad-pro13 \
            --report qa/full-evidence-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-v6-visual-evidence-verdict
          overwrite: true
          path: qa/full-evidence-verification.json
          if-no-files-found: warn
