name: Review existing simulator artifacts

on:
  push:
    branches: [v9]
    paths: ['.github/duo-touch-reference.request']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed iPhone Duo visual check run to review
        required: true

permissions:
  actions: read
  contents: read

jobs:
  inspect-failed-input:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the original screens from the failed input run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_id="$(cat .github/duo-touch-reference.request)"
          [[ "$source_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$source_id/zip" > reference.zip
          unzip -q reference.zip -d original
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install Pillow
          if ! command -v tesseract; then sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr; fi
          .qa-venv/bin/python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          import subprocess, json
          folder = Path('original')
          for name in ('duo-first-launch-permission', 'duo-after-permission', 'duo-folded-max-100',
                       'duo-unfolded-wide-max-100', 'last-duo-screen'):
              p = folder / (name + '.png')
              if not p.exists():
                  continue
              image = Image.open(p).convert('RGB')
              swatch = image.resize((128,128))
              white = sum(min(pixel) >= 245 for pixel in swatch.getdata()) / (128*128)
              ocr = subprocess.check_output(['tesseract', str(p), 'stdout', '--psm', '11'], text=True)
              print(name, image.size, f'near-white={white:.4f}', ocr[:1000])
              layout = p.with_suffix('.layout.json')
              if layout.exists():
                  data = json.loads(layout.read_text())
                  print('rendered', data['zoom'], data['viewport'], sorted(data['controls']))
          PYTHON
  package-existing-screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download original simulator captures
        uses: actions/download-artifact@v4
        with:
          name: quran-duo-visual-qa
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: original
      - name: Group original PNGs without modifying images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          root = Path('original')
          manifest = []
          for posture in ('duo-folded', 'duo-unfolded-wide', 'duo-unfolded-portrait', 'duo-half-open-book'):
              images = sorted(root.glob(f'{posture}-min-*.png')) + sorted(root.glob(f'{posture}-max-*.png'))
              assert len(images) == 2, (posture, images)
              target = Path('review') / posture
              target.mkdir(parents=True)
              for image in images:
                  shutil.copy2(image, target / image.name)
                  manifest.append({'name': image.name, 'sha256': hashlib.sha256(image.read_bytes()).hexdigest(), 'bytes': image.stat().st_size})
              for evidence in root.glob(f'{posture}-*.json'):
                  shutil.copy2(evidence, target / evidence.name)
              for evidence in root.glob(f'{posture}-*.txt'):
                  shutil.copy2(evidence, target / evidence.name)
          Path('review/manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: review-duo-folded
          path: review/duo-folded/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: review-duo-unfolded-wide
          path: review/duo-unfolded-wide/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: review-duo-unfolded-portrait
          path: review/duo-unfolded-portrait/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: review-duo-half-open-book
          path: review/duo-half-open-book/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: review-original-png-hashes
          path: review/manifest.json
          retention-days: 14
