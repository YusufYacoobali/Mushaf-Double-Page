name: Samsung foldable layout verification
run-name: Samsung passport and regular Fold · pages 6–7

on:
  push:
    branches: [v6]
    paths:
      - '.github/samsung-foldable-visual.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quran-samsung-foldable-qa-${{ github.ref }}
  cancel-in-progress: false

# These are explicitly Samsung-dimension AVDs running stock Android, not One UI
# or remote Samsung hardware. The profile metadata records sources/assumptions.
jobs:
  build-android:
    name: Build Android reader for both Samsung layouts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.1'
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-quran-android-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-quran-android-gradle-
      - name: Bound Gradle memory on the build runner
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
          org.gradle.workers.max=2
          PROPERTIES
      - name: Build unchanged app with geometry diagnostics
        run: |
          flutter pub get
          flutter build apk --debug --no-pub --target-platform android-x64 --dart-define=READER_LAYOUT_QA=true
          mkdir -p android-qa-build
          cp build/app/outputs/flutter-apk/app-debug.apk android-qa-build/reader.apk
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('android-qa-build/reader.apk')
          Path('android-qa-build/build.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'package': 'com.quran.quran_double_page',
              'platform': 'android-x64', 'reader_layout_qa': True,
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quran-android-foldable-build
          path: android-qa-build/
          retention-days: 7
          if-no-files-found: error

  capture:
    name: Capture ${{ matrix.title }}
    needs: build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: galaxy-z-fold8
            title: Galaxy Z Fold8 · passport layout
          - profile: galaxy-z-fold8-ultra
            title: Galaxy Z Fold8 Ultra · regular layout
    env:
      SAMSUNG_QA_PROFILE: ${{ matrix.profile }}
      READER_QA_PAGE: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: quran-android-foldable-build
          path: android-qa-build
      - name: Verify APK provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = json.loads(Path('android-qa-build/build.json').read_text())
          assert data['commit'] == os.environ['GITHUB_SHA']
          assert data['sha256'] == hashlib.sha256(Path('android-qa-build/reader.apk').read_bytes()).hexdigest()
          print('Verified APK matches this commit and the shared build')
          PY
      - name: Enable hardware virtualization
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android 16 emulator and image verifier
        run: |
          sdkmanager --channel=0 'emulator' 'system-images;android-36;google_apis;x86_64' 'platforms;android-36' 'build-tools;36.0.0'
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install Pillow
          echo "$PWD/.qa-venv/bin" >> "$GITHUB_PATH"
      - name: Run genuine folded, unfolded and half-open captures
        run: bash .github/scripts/run_samsung_foldable_qa.sh
      - name: Upload original frames, geometry and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-samsung-${{ matrix.profile }}-visual-qa
          path: screenshots-samsung/${{ matrix.profile }}/
          retention-days: 14
          if-no-files-found: warn

  comparison:
    name: Verify and assemble both Samsung layout comparisons
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quran-samsung-galaxy-z-fold8-visual-qa
          path: screenshots-samsung/galaxy-z-fold8
      - uses: actions/download-artifact@v4
        with:
          name: quran-samsung-galaxy-z-fold8-ultra-visual-qa
          path: screenshots-samsung/galaxy-z-fold8-ultra
      - name: Reverify and assemble original screenshots
        run: |
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install Pillow
          .qa-venv/bin/python .github/scripts/samsung_reader_comparison.py --source screenshots-samsung --output samsung-foldable-comparison.png
      - uses: actions/upload-artifact@v4
        with:
          name: quran-samsung-foldable-comparison
          path: samsung-foldable-comparison.png
          retention-days: 14
          if-no-files-found: error
