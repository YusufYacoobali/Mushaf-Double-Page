name: quran_pcm_audio
description: Bounded native continuous PCM output for cached Quran recordings.
version: 1.0.0
publish_to: none
environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.quran.pcm
        pluginClass: QuranPcmAudioPlugin
      ios:
        pluginClass: QuranPcmAudioPlugin
