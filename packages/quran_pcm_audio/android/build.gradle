group 'com.quran.pcm'
version '1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.11.1'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20' }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'com.quran.pcm'
    compileSdk 36
    defaultConfig { minSdk 23; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    sourceSets.androidTest.assets.srcDirs = ['../../../test/fixtures', 'src/androidTest/assets']
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}
repositories { google(); mavenCentral() }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
